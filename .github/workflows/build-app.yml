name: build-app

on:
  push:
    branches: [main]
    paths:
      - 'apps/portfolio/**'
      - '.github/workflows/build-app.yml'
  pull_request:
    paths:
      - 'apps/portfolio/**'

permissions:
  contents: read
  packages: write

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/tahiry-cloud-platform
  IMAGE_TAG: ${{ github.sha }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: |
          docker build \
            --build-arg PUBLIC_VERSION=${GITHUB_SHA::7} \
            -t ${{ env.IMAGE_PREFIX }}-frontend:${IMAGE_TAG} \
            apps/portfolio/frontend

      - name: Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}-frontend:${{ env.IMAGE_TAG }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Push
        if: github.event_name == 'push'
        run: docker push ${{ env.IMAGE_PREFIX }}-frontend:${IMAGE_TAG}

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: |
          docker build \
            --build-arg APP_VERSION=${{ github.sha }} \
            -t ${{ env.IMAGE_PREFIX }}-backend:${IMAGE_TAG} \
            apps/portfolio/backend

      - name: Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}-backend:${{ env.IMAGE_TAG }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Push
        if: github.event_name == 'push'
        run: docker push ${{ env.IMAGE_PREFIX }}-backend:${IMAGE_TAG}
