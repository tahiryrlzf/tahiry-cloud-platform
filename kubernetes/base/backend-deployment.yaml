apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-backend
  labels:
    app.kubernetes.io/name: portfolio-backend
    app.kubernetes.io/part-of: tahiry-cloud-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: portfolio-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: portfolio-backend
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: ghcr.io/tahiryrlzf/tahiry-cloud-platform-backend:PLACEHOLDER
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - name: APP_ENV
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: url
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 30m, memory: 48Mi }
            limits: { cpu: 150m, memory: 128Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
