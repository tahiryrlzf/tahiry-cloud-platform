apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: tahiry-cloud
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: "Projet limité aux namespaces prod et staging"
  sourceRepos:
    - "git@github.com:tahiryrlzf/tahiry-cloud-platform.git"
  destinations:
    - { namespace: prod, server: https://kubernetes.default.svc }
    - { namespace: staging, server: https://kubernetes.default.svc }
  clusterResourceWhitelist:
    - { group: "", kind: Namespace }
  namespaceResourceWhitelist:
    - { group: "", kind: "*" }
    - { group: apps, kind: "*" }
    - { group: networking.k8s.io, kind: "*" }
    - { group: batch, kind: "*" }
    - { group: rbac.authorization.k8s.io, kind: "*" }
    - { group: bitnami.com, kind: SealedSecret }
  orphanedResources: { warn: true }
