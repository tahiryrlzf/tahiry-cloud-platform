  - name: ghcr.io/tahiryrlzf/tahiry-cloud-platform-backend
    newTag: f32e67fca8e5b12535a2380d2e08cc145f8a2cd3

replicas:
  - { name: portfolio-frontend, count: 1 }
  - { name: portfolio-backend, count: 1 }
