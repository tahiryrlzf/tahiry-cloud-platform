apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: prod

resources:
  - ../../base
  - ingress.yaml
  - secrets/ghcr-pull.sealed.yaml
  - secrets/postgres-credentials.sealed.yaml

images:
  - name: ghcr.io/tahiryrlzf/tahiry-cloud-platform-frontend
    newTag: v0.1.0
  - name: ghcr.io/tahiryrlzf/tahiry-cloud-platform-backend
    newTag: v0.1.0

replicas:
  - { name: portfolio-frontend, count: 1 }
  - { name: portfolio-backend, count: 1 }
