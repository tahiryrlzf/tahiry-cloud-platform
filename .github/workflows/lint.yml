name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install yamllint
      - run: yamllint .

  ansible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install ansible ansible-lint
      - working-directory: ansible
        run: ansible-galaxy collection install -r requirements.yml
      - working-directory: ansible
        run: ansible-lint .

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz" -o /tmp/sc.tar.xz
          tar -xJf /tmp/sc.tar.xz -C "$HOME/.local/bin" --strip-components=1 shellcheck-v0.10.0/shellcheck
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: shellcheck scripts/*.sh ansible/test.sh

  kustomize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kustomize
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.5.0/kustomize_v5.5.0_linux_amd64.tar.gz" \
            | tar xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build overlays
        run: |
          kustomize build kubernetes/namespaces/overlays/prod > /dev/null
          kustomize build kubernetes/namespaces/overlays/staging > /dev/null
          kustomize build kubernetes/overlays/prod > /dev/null
          kustomize build kubernetes/overlays/staging > /dev/null
          kustomize build kubernetes/argocd > /dev/null

  kubeconform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.5.0/kustomize_v5.5.0_linux_amd64.tar.gz" \
            | tar xz -C "$HOME/.local/bin"
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz" \
            | tar xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Validate manifests
        run: |
          for dir in kubernetes/namespaces/overlays/prod \
                     kubernetes/namespaces/overlays/staging \
                     kubernetes/overlays/prod \
                     kubernetes/overlays/staging; do
            kustomize build "$dir" | kubeconform -strict -summary -ignore-missing-schemas
          done

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Install gitleaks
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz" \
            | tar xz -C "$HOME/.local/bin" gitleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: gitleaks detect --source . --redact --verbose
