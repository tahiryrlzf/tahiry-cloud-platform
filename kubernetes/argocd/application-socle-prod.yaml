apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: socle-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: tahiry-cloud
  source:
    repoURL: git@github.com:tahiryrlzf/tahiry-cloud-platform.git
    targetRevision: main
    path: kubernetes/namespaces/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=false, ApplyOutOfSyncOnly=true]
    retry:
      limit: 5
      backoff: { duration: 10s, factor: 2, maxDuration: 3m }
