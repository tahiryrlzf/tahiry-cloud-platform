apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio
spec:
  ingressClassName: traefik
  rules:
    - host: tahiry-cloud.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: portfolio-backend
                port: { number: 80 }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portfolio-frontend
                port: { number: 80 }
